[package]
name = "metapic-interrogator"
version = "0.1.0"
description = "MetaPic Interrogator desktop application"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "metapic_interrogator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12.9", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
image = { version = "0.25.10", features = ["png", "jpeg", "webp", "bmp", "tiff"] }
crc32fast = "1.5.2"
keyring = "4.2.0"
sha2 = "0.11.0"
getrandom = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
